name: VulnAI DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Security & Verification Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "vulnai-devsecops-frontend (2)/vulnai-frontend/backend"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Scanner Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap nikto wapiti sqlmap gobuster

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run Automated Test Suite (109 Tests)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "devsecops-ci-pipeline-mock-secret-key-for-testing"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "vulnai-devsecops-frontend (2)/vulnai-frontend"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "vulnai-devsecops-frontend (2)/vulnai-frontend/package-lock.json"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Verify Frontend Production Build
        run: npm run build
