services:
  mongodb:
    image: mongo:6.0
    container_name: vulnai-mongo
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: vulnai-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - SECRET_KEY=vulnai_super_secret_for_docker
      - KALI_SCRIPT_PATH=/app/scripts/kali_scanner.sh
      - SCAN_OUTPUT_DIR=/app/scan-results
      - KALI_WORDLIST=/app/wordlist/common.txt
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - scan_results:/app/scan-results
      - ./wordlist:/app/wordlist:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: 
      context: .
    container_name: vulnai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  scan_results:
