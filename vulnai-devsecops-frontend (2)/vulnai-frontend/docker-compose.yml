services:
  backend:
    build: 
      context: ./backend
    container_name: vulnai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${postgresql://neondb_owner:npg_azfh5kdDR6tV@ep-soft-wind-b49tnxma-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
      - SECRET_KEY=vulnai_super_secret_for_docker
      - KALI_SCRIPT_PATH=/app/scripts/kali_scanner.sh
      - SCAN_OUTPUT_DIR=/app/scan-results
      - KALI_WORDLIST=/app/wordlist/common.txt
    volumes:
      - scan_results:/app/scan-results
      - ./wordlist:/app/wordlist:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: 
      context: .
    container_name: vulnai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  scan_results:
